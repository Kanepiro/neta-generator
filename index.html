<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ネタジェネレーター</title>
<meta name="theme-color" content="#11140d" />
<style>
:root{
  --bg:#11140d;--panel:#171b12;--line:#353b2b;--text:#f2f0e8;--muted:#a9aa9f;--lime:#b7ff1f;--lime2:#d5ff76;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
body{min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:18px 18px 56px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800}
.logo{width:48px;height:48px;background:var(--lime);color:#11140d;display:grid;place-items:center;font-size:28px;font-weight:1000;transform:rotate(-5deg)}
.badge{font-size:12px;letter-spacing:.14em;color:#d7d7ce;margin-top:42px}
.hero{padding:12px 0 28px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(52px,11vw,112px);line-height:.86;margin:20px 0 24px;letter-spacing:-.08em;max-width:800px}
.hero h1 span{color:var(--lime)}
.hero p{color:#c8c8bd;font-size:18px;line-height:1.7;margin:0;max-width:660px}
.status{display:flex;align-items:center;gap:10px;color:#d6d7cc;margin:26px 0 16px;font-size:18px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--lime);box-shadow:0 0 18px rgba(183,255,31,.35)}
.status b{color:var(--lime);font-size:30px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.card{min-height:280px;padding:24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;background:rgba(255,255,255,.008)}
.cardhead{display:flex;align-items:center;gap:10px;color:#d1d2c8;font-weight:800}
.num{color:var(--lime);font-size:13px;letter-spacing:.08em}
.value{font-size:clamp(42px,7vw,78px);font-weight:900;line-height:1.05;letter-spacing:-.04em;padding:18px 0 26px;word-break:keep-all}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{appearance:none;border:1px solid #414838;background:#15180f;color:var(--text);padding:13px 18px;font:inherit;font-weight:800;cursor:pointer;min-height:48px}
button:hover{border-color:var(--lime);color:var(--lime)}
button.locked{background:var(--lime);color:#10130b;border-color:var(--lime)}
.controls{display:flex;gap:12px;flex-wrap:wrap;padding:24px 0}
.primary{background:var(--lime);color:#11140d;border-color:var(--lime);font-size:18px;padding:15px 22px}
.primary:hover{color:#11140d;filter:brightness(1.05)}
.small{color:#b9b9af}
.note{color:var(--muted);font-size:13px;line-height:1.7;border-top:1px solid var(--line);padding-top:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#edf8d4;color:#12150d;padding:12px 18px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:680px){
  html,body{height:100%;overflow:hidden}
  body{min-height:100dvh}
  .wrap{height:100dvh;max-width:none;padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto 1fr auto;gap:5px}
  .topbar{padding:2px 0 5px;min-height:34px}
  .brand{gap:7px;font-size:14px}.logo{width:28px;height:28px;font-size:18px}.small{font-size:10px}
  .hero{display:none}
  .status{margin:0;gap:6px;font-size:11px;line-height:1.1}
  .dot{width:7px;height:7px}.status b{font-size:16px}
  .grid{min-height:0;height:100%;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
  .card{min-height:0;padding:7px 8px 6px;overflow:hidden}
  .cardhead{gap:5px;font-size:10px;line-height:1}.num{font-size:9px}
  .value{font-size:clamp(18px,6.2vw,28px);line-height:.98;letter-spacing:-.05em;padding:3px 0 5px;overflow-wrap:anywhere;word-break:normal}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .actions button{min-height:28px;padding:3px 2px;font-size:10px;white-space:nowrap}
  .controls{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:5px;padding:0}
  .controls button{min-height:34px;padding:5px 4px;font-size:10px;white-space:nowrap}
  .controls .primary{font-size:11px;padding:5px 4px}
  .note{display:none}
  .toast{bottom:12px;padding:8px 12px;font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand"><div class="logo">ネ</div><div>ネタジェネレーター</div></div>
    <div class="small">PURE RANDOM</div>
  </header>

  <section class="hero">
    <div class="badge">● TREND-FREE / PURE RANDOM</div>
    <h1>無関係を、<br><span>ぶつけろ。</span></h1>
    <p>流行データも、おすすめ補正もなし。<br>6つの材料を独立して引くだけ。</p>
  </section>

  <div class="status"><span class="dot"></span><span><b>6</b> カテゴリを抽選しています</span></div>
  <main class="grid" id="grid"></main>

  <div class="controls">
    <button class="primary" id="rerollAll">全部引き直す</button>
    <button id="copyAll">結果をコピー</button>
    <button id="resetHistory">抽選履歴をリセット</button>
  </div>
  <div class="note">
    同じカテゴリでは、登録語を一巡するまで同じ言葉は再登場しません。6枠の中でも同じ言葉は重複しません。<br>
    抽選履歴はこの端末のブラウザ内にだけ保存されます。外部API・AI API・有料サービスは使用しません。
  </div>
</div>
<div class="toast" id="toast">コピーしました</div>

    "拝む","謝る","拍手する","お辞儀する","乾杯する","相談する","説教する","実況する","採点する","面接する","注文する","配達する","掃除する","料理する","撮影する","録音する","観察する","実験する","練習する","検品する",

  ]

const KEYS = Object.keys(DATA);
const STORAGE = 'neta-generator-v2-bags';
const state = { values:{}, locks:{}, bags:{} };

function unique(arr){ return [...new Set(arr.map(v=>String(v).trim()).filter(Boolean))]; }
for (const k of KEYS) DATA[k] = unique(DATA[k]);

function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}
  return x;
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(STORAGE)||'{}');
    state.bags=s.bags||{};
    state.values=s.values||{};
    state.locks=s.locks||{};
  }catch(e){}
}
function save(){ localStorage.setItem(STORAGE, JSON.stringify(state)); }
function refill(key){
  const last=state.values[key];
  let bag=shuffle(DATA[key]);
  if(last && bag.length>1 && bag[bag.length-1]===last){
    const i=Math.floor(Math.random()*(bag.length-1));
    [bag[i],bag[bag.length-1]]=[bag[bag.length-1],bag[i]];
  }
  state.bags[key]=bag;
}
function draw(key, forbidden=new Set()){
  if(!Array.isArray(state.bags[key]) || state.bags[key].length===0) refill(key);
  let idx=-1;
  for(let i=state.bags[key].length-1;i>=0;i--){
    const candidate=state.bags[key][i];
    if(candidate!==state.values[key] && !forbidden.has(candidate)){ idx=i; break; }
  }
  if(idx<0){
    if(state.bags[key].length===0) refill(key);
    idx=state.bags[key].length-1;
  }
  const [next]=state.bags[key].splice(idx,1);
  state.values[key]=next;
  save();
  return next;
}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const used=new Set(Object.values(state.values).filter(Boolean));
  KEYS.forEach((key,i)=>{
    if(!state.values[key]){
      state.values[key]=draw(key,used);
      used.add(state.values[key]);
    }
    const card=document.createElement('section'); card.className='card';
    card.innerHTML=`
      <div>
        <div class="cardhead"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${esc(key)}</span></div>
        <div class="value" id="value-${i}">${esc(state.values[key])}</div>
      </div>
      <div class="actions">
        <button class="${state.locks[key]?'locked':''}" data-lock="${i}">${state.locks[key]?'● 固定中':'○ 固定'}</button>
        <button data-reroll="${i}">↻ 引き直す</button>
      </div>`;
    grid.appendChild(card);
  });
}
function rerollOne(i){
  const key=KEYS[i];
  const used=new Set(KEYS.filter(k=>k!==key).map(k=>state.values[k]).filter(Boolean));
  draw(key,used);
  render();
}
function rerollAll(){
  const used=new Set(KEYS.filter(k=>state.locks[k]).map(k=>state.values[k]).filter(Boolean));
  KEYS.forEach(k=>{
    if(!state.locks[k]){
      draw(k,used);
      used.add(state.values[k]);
    }
  });
  render();
}
function resultText(){ return KEYS.map(k=>`${k}：${state.values[k]}`).join('\n'); }
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1300)}

document.addEventListener('click',async e=>{
  const l=e.target.closest('[data-lock]');
  if(l){const k=KEYS[+l.dataset.lock];state.locks[k]=!state.locks[k];save();render();return;}
  const r=e.target.closest('[data-reroll]');
  if(r){rerollOne(+r.dataset.reroll);return;}
});
document.getElementById('rerollAll').onclick=rerollAll;
document.getElementById('copyAll').onclick=async()=>{
  try{await navigator.clipboard.writeText(resultText());toast('コピーしました');}
  catch{toast('コピーできませんでした');}
};
document.getElementById('resetHistory').onclick=()=>{
  if(!confirm('抽選履歴と固定状態をリセットしますか？')) return;
  localStorage.removeItem(STORAGE); state.values={};state.locks={};state.bags={};render();toast('履歴をリセットしました');
};
load();render();
</script>

</html>
