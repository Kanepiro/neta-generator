name: Expand generator to 30000 per category

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-30000-per-category.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand candidate pools
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text()
          marker = 'const KEYS = Object.keys(DATA);'
          encoded = ''
          block = base64.b64decode(encoded).decode('utf-8')
          if 'const TARGET_PER_CATEGORY = 30000;' not in s:
              s = s.replace(marker, block + '\n' + marker)
          old = '一度出た言葉は、カテゴリをまたいでも抽選履歴をリセットするまで再登場しません。6枠の中でも同じ言葉は重複しません。'
          new = '各カテゴリ30,000候補です。一度出た言葉は、カテゴリをまたいでも抽選履歴をリセットするまで再登場しません。6枠の中でも同じ言葉は重複しません。'
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify expansion marker
        shell: bash
        run: |
          grep -q "const TARGET_PER_CATEGORY = 30000;" index.html
          grep -q "各カテゴリ30,000候補" index.html
      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Expand all categories to 30000 candidates"
          git push
