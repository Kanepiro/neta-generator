name: Expand generator to 30000 per category

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-30000-per-category.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand candidate pools
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = 'const KEYS = Object.keys(DATA);'
          if 'const TARGET_PER_CATEGORY = 30000;' not in s:
              block = r'''
const TARGET_PER_CATEGORY = 30000;
function expandCategory(base, a, b, formatter){
  const out=[];
  for(const x of a){
    for(const y of b){
      for(const z of base){
        out.push(formatter(z,x,y));
        if(out.length===TARGET_PER_CATEGORY)return out;
      }
    }
  }
  return out;
}

const ACTOR_A=["無表情で、","やたら真剣に、","眠そうに、","得意げに、","緊張しながら、","慌てながら、","堂々と、","不安そうに、","満足そうに、","ぼんやりしながら、","周囲を警戒しながら、","時計を気にしながら、","急ぎ足で、","のんびりと、","妙に慎重に、","落ち着き払って、","首をかしげながら、","笑顔で、","困った顔で、","驚いた顔で、","疲れ切って、","上機嫌で、","無言のまま、","カメラを気にせず、","何事もない顔で、"];
const ACTOR_B=["赤い帽子をかぶった","青い作業着の","白い手袋をした","大きなリュックを背負った","ヘルメット姿の","正装した","パジャマ姿の","長靴を履いた","雨合羽姿の","サングラス姿の","花束を抱えた","買い物袋を持った","番号札を持った","カメラを提げた","腕組みした"];

const PLACE_A=["雨上がりの","夜明け前の","真昼の","夕暮れの","深夜の","真冬の","真夏の","霧に包まれた","強風が吹く","小雨の降る","雪が残る","快晴の","曇り空の","閉店後の","開店直後の","休日の","平日の朝の","人の少ない","人で混み合う","照明の暗い","明るく照らされた","風のない","鳥の声が響く","雨音だけ聞こえる","妙に静かな"];
const PLACE_B=["静まり返った","散らかった","綺麗に片付いた","古びた","新しく整備された","工事中の","誰もいない","人影のまばらな","妙に広い","やけに狭い","植物の多い","コンクリートだらけの","看板の多い","照明だけ明るい","日常感の強い"];

const PROP_A=["巨大な","手のひらサイズの","細長い","丸い","四角い","真っ赤な","真っ青な","真っ白な","真っ黒な","黄色い","銀色の","金色の","透明な","半透明の","木製の","金属製の","プラスチック製の","布製の","紙製の","ゴム製の","妙に重そうな","異様に軽そうな","つやつやした","傷だらけの","泥のついた"];
const PROP_B=["新品の","使い古された","ピカピカの","少し壊れた","包装された","ラベル付きの","番号札の付いた","テープで補修された","汚れた","濡れた","乾いた","冷えた","温まった","丁寧に磨かれた","無造作に置かれた"];

const ACTION_A=["無言で、","全力で、","異様に真剣に、","やたら慎重に、","ものすごく急いで、","妙にゆっくり、","一定のリズムで、","一切迷わず、","何度も確認しながら、","周囲を警戒しながら、","時計を気にしながら、","満足そうに、","不安そうに、","楽しそうに、","退屈そうに、","淡々と、","大げさに、","必要以上に丁寧に、","勢いよく、","そっと、","片手で、","両手で、","姿勢を正して、","カメラを見ずに、","当然の仕事のように、"];
const ACTION_B=["ひとりで","二人がかりで","順番を守って","交代しながら","掛け声なしで","白手袋のまま","ヘルメット姿で","正装のまま","休まず","途中で止まらず","何度もやり直しながら","周囲に見守られながら","誰にも頼まれていないのに","説明なしで","最後まで黙って"];

const STATE_A=["朝から、","昼休みに、","夕方まで、","閉店直前まで、","開店直後から、","雨の中でも、","強風の中でも、","真冬なのに、","猛暑なのに、","誰も見ていないのに、","人だかりの中で、","静かな場所で、","明るい照明の下で、","暗い場所で、","作業開始からずっと、","休憩せずに、","周囲が騒がしくても、","カメラが回っていても、","時間を気にせず、","予定より早く、","予定より遅く、","開始直後から、","終了間際まで、","一度も止まらず、","何の説明もなく、"];
const STATE_B=["周囲を気にしつつ、","時計を見ながら、","足元を確認しながら、","互いに目を合わせず、","妙に息を合わせて、","必要以上に静かに、","やけに堂々と、","少し戸惑いながら、","何度もうなずきながら、","道具を確認しながら、","列を崩さず、","姿勢を正したまま、","カメラ目線なしで、","一切しゃべらず、","当然のように、"];

const RESULT_A=["結局、","最終的に、","作業の末、","最後には、","しばらくすると、","数分後、","全員が見守る中、","誰も気づかないまま、","何の説明もないまま、","予定どおり、","予定外に、","妙にあっさり、","異様に丁寧な作業の末、","長い確認のあと、","一斉に手を止めたあと、","責任者が確認すると、","作業員が離れると、","カメラが引くと、","周囲が静まると、","その場を片付けると、","全員がうなずいたあと、","拍手もないまま、","誰も驚かないまま、","日常の作業のように、","なぜか当然のように、"];
const RESULT_B=["。そのまま終了する","。全員その場を離れる","。誰も説明しない","。カメラは固定されたまま終わる","。周囲だけ静かになる","。作業道具だけ片付けられる","。次の作業へ移る","。責任者だけ確認して去る","。全員が一度うなずく","。何事もなく日常へ戻る","。その場には誰も残らない","。最後に一度だけ確認する","。誰も振り返らない","。記録だけ残して終わる","。その後は何も起きない"];

DATA["主役"]=expandCategory(DATA["主役"],ACTOR_A,ACTOR_B,(base,a,b)=>`${a}${b}${base}`);
DATA["場所"]=expandCategory(DATA["場所"],PLACE_A,PLACE_B,(base,a,b)=>`${a}${b}${base}`);
DATA["小道具"]=expandCategory(DATA["小道具"],PROP_A,PROP_B,(base,a,b)=>`${a}${b}${base}`);
DATA["行動"]=expandCategory(DATA["行動"],ACTION_A,ACTION_B,(base,a,b)=>`${a}${b}${base}`);
DATA["状態"]=expandCategory(DATA["状態"],STATE_A,STATE_B,(base,a,b)=>`${a}${b}${base}`);
DATA["結果"]=expandCategory(DATA["結果"],RESULT_A,RESULT_B,(base,a,b)=>`${a}${base}${b}`);
'''
              s = s.replace(marker, block + '\n' + marker)
          s = s.replace('一度出た言葉は、カテゴリをまたいでも抽選履歴をリセットするまで再登場しません。6枠の中でも同じ言葉は重複しません。', '各カテゴリ30,000候補です。一度出た言葉は、カテゴリをまたいでも抽選履歴をリセットするまで再登場しません。6枠の中でも同じ言葉は重複しません。')
          p.write_text(s)
          PY
      - name: Verify candidate counts
        shell: bash
        run: |
          grep -q "const TARGET_PER_CATEGORY = 30000;" index.html
          grep -q "各カテゴリ30,000候補" index.html
      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Expand all categories to 30000 candidates"
          git push
